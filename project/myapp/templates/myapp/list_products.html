<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>قائمة المنتجات</title>
</head>
<body>
<h2>قائمة المنتجات</h2>

<a href="{% url 'add_product' %}">➕ إضافة منتج</a>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>الاسم</th>
        <th>السعر</th>
        <th>إجراءات</th>
    </tr>
    {% for product in products %}
    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td>
            <a href="{% url 'edit_product' product.id %}">✏️ تعديل</a>
            |
            <a href="{% url 'delete_product' product.id %}">🗑 حذف</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
