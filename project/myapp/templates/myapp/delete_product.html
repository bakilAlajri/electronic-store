{% extends "myapp/base.html" %}

{% block content %}
<div class="container text-center" style="max-width:400px; margin:auto;">
    <h3>⚠️ هل أنت متأكد؟</h3>
    <p>سيتم حذف المنتج: <strong>{{ product.name }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger">🗑️ حذف</button>
        <a href="{% url 'products' %}" class="btn btn-secondary">إلغاء</a>
    </form>
</div>
{% endblock %}
