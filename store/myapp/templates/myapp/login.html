{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>

    <!-- Bootstrap RTL -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">

    <!-- ملف CSS -->
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">🔵 MyStore</a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">الرئيسية</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'products' %}">المنتجات</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">تسجيل الدخول</a></li> 
        </ul>
    </div>
</nav> 

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 300px;">

        <h3 class="text-center mb-4">تسجيل الدخول</h3>

        {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-10">
                <label class="form-label">اسم المستخدم</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="ادخل اسم المستخدم"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="********"
                    required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                دخول
            </button>
        </form>

    </div>
</div>

</body>
</html>
